<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class='web-page'>
        <nav class="container">
             <nav class="navigation">

                    <img class="navigation__main--img" src="./img/menu.svg" alt="menu">

                 <img class="header navigation__label--main" src="./img/label.png" alt="cps">
                 <div class="header free">

                 </div>

                    <img class="navigation__seting--img" src="./img/seting.svg" alt="seting">
                 </button>
                 <button class="header navigation__find--all">
                    <img class="navigation__find--img" src="./img/search.svg" alt="find">

                    <button class="content__text--Description--next" id="button-next" > 
                        <img class="arrow" src="./img/expand.svg" alt=""> 
                        <label for="button-next">Читать дальше</label>
                    </button>
                </div>
                <img class="content__img" src="./img/_MG_3223.png" alt="CPS">
            </div>
        </div>
    </div>
